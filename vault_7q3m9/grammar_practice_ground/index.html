document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

;pointer-events:none;animation:{{ b.anim }}\">\n      <div style=\"max-width:min(300px,70vw);padding:12px 18px;border-radius:999px;font-size:14px;line-height:1.45;color:var(--text);background:var(--glass);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border:1px solid var(--glass-border);box-shadow:inset 0 1px 0 var(--glass-hi),0 8px 24px var(--shadow),var(--glow);animation:{{ b.sway }}\">{{ b.text }}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fsc-for>\n\n<div style=\"position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column\">\n\n  <!-- Top bar -->\n  <header style=\"position:sticky;top:12px;z-index:10;width:min(1120px,calc(100% - 24px));margin:12px auto 0;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 12px 10px 20px;border-radius:999px;background:var(--glass);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border:1px solid var(--glass-border);box-shadow:inset 0 1px 0 var(--glass-hi),0 10px 30px var(--shadow),var(--glow);transition:background-color .6s ease,border-color .6s ease,box-shadow .6s ease\">\n    <div style=\"font-family:'Hind Siliguri',sans-serif;font-weight:700;font-size:15px;letter-spacing:.01em;color:var(--head);white-space:nowrap\">IELTS Grammar · Practice Ground<\u002Fdiv>\n    <div style=\"display:flex;gap:8px\">\n      <button type=\"button\" sc-camel-on-click=\"{{ toggleMode }}\" style=\"font-family:'Hind Siliguri',sans-serif;font-weight:600;font-size:14px;padding:9px 16px;border-radius:999px;cursor:pointer;color:var(--btn-fg);background:var(--btn-bg);border:1px solid var(--glass-border);transition:background-color .3s ease,color .3s ease,transform .2s ease\" style-hover=\"background:var(--btn-hover);transform:translateY(-1px)\" style-focus=\"outline:3px solid var(--focus);outline-offset:2px\">{{ modeLabel }}<\u002Fbutton>\n      <button type=\"button\" sc-camel-on-click=\"{{ toggleNeon }}\" aria-pressed=\"{{ neon }}\" style=\"font-family:'Hind Siliguri',sans-serif;font-weight:600;font-size:14px;padding:9px 16px;border-radius:999px;cursor:pointer;color:var(--btn-fg);border:1px solid var(--glass-border);transition:background-color .3s ease,color .3s ease,transform .2s ease;background:{{ neonBg }}\" style-hover=\"background:var(--btn-hover);transform:translateY(-1px)\" style-focus=\"outline:3px solid var(--focus);outline-offset:2px\">⚡ Neon<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <main style=\"width:min(1120px,100%);margin:0 auto;padding:0 clamp(16px,4vw,40px);flex:1\">\n\n    <!-- Hero -->\n    <section style=\"text-align:center;padding:clamp(56px,9vh,96px) 0 28px;display:flex;flex-direction:column;align-items:center\">\n      <span style=\"display:inline-flex;align-items:center;gap:8px;font-family:'Hind Siliguri',sans-serif;font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--head);padding:8px 16px;border-radius:999px;background:var(--glass);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border:1px solid var(--glass-border);box-shadow:inset 0 1px 0 var(--glass-hi),0 6px 20px var(--shadow),var(--glow);transition:background-color .6s ease,border-color .6s ease\">19 Worksheets · One Ground<\u002Fspan>\n      <h1 style=\"margin:22px 0 20px;font-family:'Hind Siliguri',sans-serif;font-weight:700;font-size:clamp(42px,7.5vw,88px);line-height:1.02;letter-spacing:-.02em;background-image:var(--h1-grad);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:shine 8s linear infinite;filter:var(--h1-glow);text-wrap:balance\">IELTS Grammar<br>Practice Ground<\u002Fh1>\n      <p style=\"max-width:640px;margin:0 0 34px;font-size:18px;line-height:1.75;color:var(--text);text-wrap:pretty\">প্রতিটা worksheet-এ MCQ, Error Correction, Sentence Completion আর একটা IELTS-style writing activity আছে — নিচে থেকে বেছে নাও আর শুরু করে দাও।<\u002Fp>\n\n      <!-- Stats -->\n      <div style=\"display:flex;flex-wrap:wrap;justify-content:center;gap:14px\">\n        <div style=\"min-width:150px;padding:16px 24px;border-radius:18px;background:var(--glass);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border:1px solid var(--glass-border);box-shadow:inset 0 1px 0 var(--glass-hi),0 10px 30px var(--shadow),var(--glow);transition:background-color .6s ease,border-color .6s ease,box-shadow .6s ease\">\n          <div style=\"font-family:'Hind Siliguri',sans-serif;font-weight:700;font-size:34px;line-height:1;color:var(--stat);font-variant-numeric:tabular-nums\">{{ n1 }}<\u002Fdiv>\n          <div style=\"margin-top:6px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)\">Worksheets<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"min-width:150px;padding:16px 24px;border-radius:18px;background:var(--glass);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border:1px solid var(--glass-border);box-shadow:inset 0 1px 0 var(--glass-hi),0 10px 30px var(--shadow),var(--glow);transition:background-color .6s ease,border-color .6s ease,box-shadow .6s ease\">\n          <div style=\"font-family:'Hind Siliguri',sans-serif;font-weight:700;font-size:34px;line-height:1;color:var(--stat);font-variant-numeric:tabular-nums\">{{ n2 }}+<\u002Fdiv>\n          <div style=\"margin-top:6px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)\">Practice Questions<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"min-width:150px;padding:16px 24px;border-radius:18px;background:var(--glass);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border:1px solid var(--glass-border);box-shadow:inset 0 1px 0 var(--glass-hi),0 10px 30px var(--shadow),var(--glow);transition:background-color .6s ease,border-color .6s ease,box-shadow .6s ease\">\n          <div style=\"font-family:'Hind Siliguri',sans-serif;font-weight:700;font-size:34px;line-height:1;color:var(--stat);font-variant-numeric:tabular-nums\">{{ n3 }}<\u002Fdiv>\n          <div style=\"margin-top:6px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)\">Activities Each<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Quote strip -->\n      <div aria-live=\"polite\" style=\"width:min(720px,100%);margin-top:28px;min-height:64px;display:flex;align-items:center;justify-content:center;padding:16px 26px;border-radius:16px;background:var(--glass);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border:1px solid var(--glass-border);box-shadow:inset 0 1px 0 var(--glass-hi),0 10px 30px var(--shadow),var(--glow);transition:background-color .6s ease,border-color .6s ease,box-shadow .6s ease\">\n        <p style=\"margin:0;font-style:italic;font-size:17px;line-height:1.55;color:var(--text);transition:opacity .6s ease;opacity:{{ qo }}\">“{{ quote }}”<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- Byline -->\n    <p style=\"text-align:center;margin:26px auto 52px;max-width:760px;font-size:14px;line-height:1.8;color:var(--muted)\">✍️ Abidur Rahman Tahmid &nbsp;|&nbsp; 🎓 BA (Hons), University of Greenwich (UK) &nbsp;|&nbsp; 🎓 EMBA, Dhaka University<\u002Fp>\n\n    <!-- DATA: worksheet grid -->\n    <section style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;padding-bottom:24px\">\n      <sc-for list=\"{{ worksheets }}\" as=\"w\" hint-placeholder-count=\"19\">\n        <div style=\"animation:reveal .7s cubic-bezier(.2,.7,.2,1) both;animation-delay:{{ w.delay }};perspective:900px\">\n          <a href=\"{{ w.file }}\" sc-camel-on-mouse-move=\"{{ tilt }}\" sc-camel-on-mouse-enter=\"{{ enter }}\" sc-camel-on-mouse-leave=\"{{ leave }}\" style=\"position:relative;display:flex;flex-direction:column;gap:14px;height:100%;padding:22px 22px 20px;border-radius:20px;text-decoration:none;color:var(--text);overflow:hidden;background:var(--glass);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border:1px solid var(--glass-border);box-shadow:inset 0 1px 0 var(--glass-hi),0 10px 30px var(--shadow),var(--glow);transition:transform .18s ease-out,box-shadow .4s ease,background-color .6s ease,border-color .6s ease;will-change:transform\" style-hover=\"box-shadow:inset 0 1px 0 var(--glass-hi),0 18px 44px var(--shadow),var(--hover-glow)\" style-focus=\"outline:3px solid var(--focus);outline-offset:3px\">\n            <span data-sweep=\"1\" aria-hidden=\"true\" style=\"position:absolute;top:-30%;bottom:-30%;left:0;width:45%;background:linear-gradient(90deg,transparent,var(--sweep),transparent);transform:translateX(-130%) skewX(-18deg);pointer-events:none\"><\u002Fspan>\n            <span style=\"align-self:flex-start;font-family:'Hind Siliguri',sans-serif;font-weight:700;font-size:13px;letter-spacing:.1em;padding:6px 10px;border-radius:10px;background:var(--badge-bg);color:var(--badge-fg);transition:background-color .6s ease,color .6s ease\">{{ w.num }}<\u002Fspan>\n            <h3 style=\"margin:0;font-family:'Hind Siliguri',sans-serif;font-weight:600;font-size:21px;line-height:1.25;color:var(--head);text-wrap:balance;transition:color .6s ease\">{{ w.title }}<\u002Fh3>\n            <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n              <span style=\"font-family:'Hind Siliguri',sans-serif;font-weight:500;font-size:12.5px;padding:5px 11px;border-radius:999px;background:var(--pill-bg);color:var(--pill-fg);border:1px solid var(--pill-border);transition:background-color .6s ease,color .6s ease\">{{ w.marks }} marks<\u002Fspan>\n              <span style=\"font-family:'Hind Siliguri',sans-serif;font-weight:500;font-size:12.5px;padding:5px 11px;border-radius:999px;background:var(--pill-bg);color:var(--pill-fg);border:1px solid var(--pill-border);transition:background-color .6s ease,color .6s ease\">{{ w.activities }} activities<\u002Fspan>\n            <\u002Fdiv>\n            <span style=\"margin-top:auto;padding-top:6px;display:inline-flex;align-items:center;gap:6px;font-family:'Hind Siliguri',sans-serif;font-weight:600;font-size:15px;color:var(--head);transition:color .6s ease\">Open worksheet <span data-arrow=\"1\" style=\"display:inline-block;transition:transform .35s ease\">→<\u002Fspan><\u002Fspan>\n          <\u002Fa>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fsection>\n  <\u002Fmain>\n\n  <footer style=\"text-align:center;padding:44px 20px 32px;font-family:'Hind Siliguri',sans-serif;font-size:13px;letter-spacing:.04em;color:var(--muted)\">IELTS Grammar Practice — Practice Ground<\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;bubbles&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Effects&quot;},&quot;tilt&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:7,&quot;min&quot;:0,&quot;max&quot;:12,&quot;step&quot;:1,&quot;unit&quot;:&quot;°&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Effects&quot;},&quot;quoteSeconds&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:7,&quot;min&quot;:3,&quot;max&quot;:20,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Effects&quot;}}\">\n/* DATA */\nconst QUOTES = [\n  \"You don't have to be great to start, but you have to start to be great.\",\n  \"Procrastination makes easy things hard and hard things harder.\",\n  \"Success is the sum of small efforts repeated day in and day out.\",\n  \"A little progress each day adds up to big results.\",\n  \"The beautiful thing about learning is no one can take it away from you.\",\n  \"A person who never made a mistake never tried anything new.\",\n  \"The best way to predict your future is to create it.\"\n];\nconst RAW = [\n  [\"Articles (a / an / the)\", \"Articles-a-an-the-Worksheet.html\", 40, 4],\n  [\"Subject–Verb Agreement\", \"Subject-Verb-Agreement-Worksheet.html\", 40, 4],\n  [\"Prepositions\", \"Prepositions-Worksheet.html\", 40, 4],\n  [\"Tenses\", \"Tenses-Worksheet.html\", 55, 5],\n  [\"Complex Sentences\", \"Complex-Sentences-Worksheet.html\", 40, 4],\n  [\"Relative Clauses\", \"Relative-Clauses-Worksheet.html\", 40, 4],\n  [\"Passive Voice\", \"Passive-Voice-Worksheet.html\", 45, 5],\n  [\"Linking Words / Cohesive Devices\", \"Linking-Words-Cohesive-Devices-Worksheet.html\", 40, 4],\n  [\"Comparatives & Superlatives\", \"Comparatives-Superlatives-Worksheet.html\", 40, 4],\n  [\"Conditionals\", \"Conditionals-Worksheet.html\", 40, 4],\n  [\"Modal Verbs\", \"Modal-Verbs-Worksheet.html\", 40, 4],\n  [\"Gerunds and Infinitives\", \"Gerunds-and-Infinitives-Worksheet.html\", 40, 4],\n  [\"Suffixes and Prefixes\", \"Suffixes-and-Prefixes-Worksheet.html\", 40, 4],\n  [\"Complex Noun Phrases\", \"Complex-Noun-Phrases-Worksheet.html\", 40, 4],\n  [\"Countable/Uncountable Nouns & Quantifiers\", \"Countable-Uncountable-Nouns-Quantifiers-Worksheet.html\", 40, 4],\n  [\"Punctuation & Sentence Boundaries\", \"Punctuation-Sentence-Boundaries-Worksheet.html\", 44, 4],\n  [\"Cause & Effect / Contrast Cohesive Devices\", \"Cause-Effect-Contrast-Cohesive-Devices-Worksheet.html\", 40, 4],\n  [\"Adjective Order\", \"Adjective-Order-Worksheet.html\", 40, 4],\n  [\"Nominalization\", \"Nominalization-Worksheet.html\", 40, 4]\n];\nconst WORKSHEETS = RAW.map(([title, file, marks, activities], i) => ({\n  title, file, marks, activities, num: String(i + 1).padStart(2, '0'), delay: (i * 55) + 'ms'\n}));\n\nclass Component extends DCLogic {\n  state = { base: 'light', neon: false, n1: 0, n2: 0, n3: 0, qi: 0, qo: 1, slots: [0, 1, 2, 3].map(() => ({ on: false, k: 0 })) };\n  timers = []; spotRef = React.createRef(); gen = 0;\n\n  componentDidMount() {\n    /* THEME: restore */\n    try { const t = JSON.parse(localStorage.getItem('igp-theme') || '{}'); this.setState({ base: t.base === 'dark' ? 'dark' : 'light', neon: !!t.neon }); } catch (e) {}\n    this.reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;\n    this.fine = matchMedia('(pointer: fine)').matches;\n\n    /* EFFECTS: count-up */\n    if (this.reduced) this.setState({ n1: 19, n2: 760, n3: 5 });\n    else {\n      const t0 = performance.now(), D = 1500;\n      const step = now => {\n        const p = Math.min(1, (now - t0) / D), e = 1 - Math.pow(1 - p, 3);\n        this.setState({ n1: Math.round(19 * e), n2: Math.round(760 * e), n3: Math.round(5 * e) });\n        if (p < 1) this.raf = requestAnimationFrame(step);\n      };\n      this.raf = requestAnimationFrame(step);\n    }\n\n    /* EFFECTS: quote strip + bubbles */\n    this.startQuotes();\n    this.timers.push(setInterval(this.spawn, 9000), setTimeout(this.spawn, 1800));\n\n    /* EFFECTS: cursor spotlight (fine pointers only) */\n    if (this.fine && !this.reduced) {\n      this.onMove = e => { const el = this.spotRef.current; if (el) el.style.background = `radial-gradient(620px circle at ${e.clientX}px ${e.clientY}px, var(--spot), transparent 70%)`; };\n      window.addEventListener('pointermove', this.onMove, { passive: true });\n    }\n  }\n  componentDidUpdate(prev) { if (prev.quoteSeconds !== this.props.quoteSeconds) this.startQuotes(); }\n  componentWillUnmount() {\n    this.timers.forEach(t => { clearInterval(t); clearTimeout(t); });\n    clearInterval(this.qTimer); cancelAnimationFrame(this.raf);\n    if (this.onMove) window.removeEventListener('pointermove', this.onMove);\n  }\n\n  startQuotes() {\n    clearInterval(this.qTimer);\n    const ms = Math.max(3, this.props.quoteSeconds ?? 7) * 1000;\n    this.qTimer = setInterval(() => {\n      this.setState({ qo: 0 });\n      this.timers.push(setTimeout(() => this.setState(s => ({ qi: (s.qi + 1) % QUOTES.length, qo: 1 })), 600));\n    }, ms);\n  }\n\n  spawn = () => {\n    if (!(this.props.bubbles ?? true) || this.reduced || document.hidden) return;\n    const g = ++this.gen, dur = 18 + Math.random() * 8;\n    this.setState(s => {\n      const slots = s.slots.slice();\n      let i = slots.findIndex(x => !x.on); if (i < 0) i = g % slots.length;\n      const k = (slots[i].k || 0) + 1;\n      slots[i] = { on: true, g, k, left: (5 + Math.random() * 80).toFixed(1) + '%',\n        anim: `${k % 2 ? 'riseA' : 'riseB'} ${dur.toFixed(2)}s linear forwards`,\n        sway: `sway ${(4 + Math.random() * 3).toFixed(2)}s ease-in-out infinite alternate`,\n        text: QUOTES[(g + 3) % QUOTES.length] };\n      return { slots };\n    });\n    this.timers.push(setTimeout(() => this.setState(s => ({ slots: s.slots.map(x => x.g === g ? { on: false, k: x.k } : x) })), dur * 1000 + 300));\n  };\n\n  /* THEME */\n  setTheme = patch => this.setState(patch, () => {\n    const { base, neon } = this.state;\n    document.documentElement.setAttribute('data-theme', neon ? 'neon' : base);\n    try { localStorage.setItem('igp-theme', JSON.stringify({ base, neon })); } catch (e) {}\n  });\n\n  /* EFFECTS: card tilt / light sweep / arrow nudge */\n  tilt = e => {\n    const k = this.props.tilt ?? 7;\n    if (!this.fine || this.reduced || !k) return;\n    const el = e.currentTarget, r = el.getBoundingClientRect();\n    const x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;\n    el.style.transform = `perspective(900px) rotateX(${(-y * 2 * k).toFixed(2)}deg) rotateY(${(x * 2 * k).toFixed(2)}deg) scale(1.03)`;\n  };\n  enter = e => {\n    const el = e.currentTarget, sw = el.querySelector('[data-sweep]'), ar = el.querySelector('[data-arrow]');\n    if (ar) ar.style.transform = 'translateX(6px)';\n    if (sw && !this.reduced) {\n      sw.style.transition = 'none'; sw.style.transform = 'translateX(-130%) skewX(-18deg)';\n      sw.getBoundingClientRect();\n      sw.style.transition = 'transform .9s ease'; sw.style.
